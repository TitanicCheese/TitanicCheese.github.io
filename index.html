<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Donsö Källarn</title>
  <meta name="description" content="Här finns flera verktyg som kan användas för aktiviteter på källarn.">
  <meta name="theme-color" content="#e9fbfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#050708" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    /* Liquid glass i turkos, vitt och svart */
    :root {
      --bg: #f2fbfb;
      --text: #050708;
      --muted: #3f5557;
      --turq: #10c4c4;
      --turq-deep: #079a9e;
      --turq-soft: rgba(16, 196, 196, .14);
      --glass: rgba(255, 255, 255, .55);
      --glass-strong: rgba(255, 255, 255, .78);
      --edge: rgba(255, 255, 255, .9);
      --hairline: rgba(5, 7, 8, .08);
      --shadow: 0 12px 40px rgba(0, 60, 64, .16), 0 2px 6px rgba(0, 40, 44, .08);
      --shine: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(255, 255, 255, .3);
      --blob-1: #2ee6e0;
      --blob-2: #9ff3f0;
      --blob-3: #0aa5ad;
      --blob-4: #ffffff;
      --blur: blur(22px) saturate(170%);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #050708;
        --text: #f4ffff;
        --muted: #9db8ba;
        --turq: #2ee6e0;
        --turq-deep: #10c4c4;
        --turq-soft: rgba(46, 230, 224, .14);
        --glass: rgba(18, 26, 28, .55);
        --glass-strong: rgba(14, 20, 22, .8);
        --edge: rgba(255, 255, 255, .16);
        --hairline: rgba(255, 255, 255, .08);
        --shadow: 0 14px 44px rgba(0, 0, 0, .55);
        --shine: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 -1px 0 rgba(255, 255, 255, .04);
        --blob-1: #0aa5ad;
        --blob-2: #064f53;
        --blob-3: #10c4c4;
        --blob-4: #0b1416;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: -apple-system, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: calc(env(safe-area-inset-top) + 40px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(16px, env(safe-area-inset-left));
    }
    body::before {
      content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
      background:
        radial-gradient(38% 32% at 10% 8%, var(--blob-1), transparent 70%),
        radial-gradient(34% 30% at 92% 16%, var(--blob-2), transparent 70%),
        radial-gradient(42% 34% at 82% 82%, var(--blob-3), transparent 70%),
        radial-gradient(36% 30% at 12% 90%, var(--blob-4), transparent 72%),
        var(--bg);
      opacity: .8;
    }
    main { max-width: 960px; margin: 0 auto; }

    .hero {
      text-align: center; padding: 34px 22px 30px; margin-bottom: 28px;
      background: var(--glass); border: 1px solid var(--edge); border-radius: 30px;
      box-shadow: var(--shine), var(--shadow);
      -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center;
      background: linear-gradient(145deg, #050708, #13292b); color: var(--turq);
      box-shadow: 0 8px 24px rgba(16, 196, 196, .35), inset 0 1px 0 rgba(255, 255, 255, .25);
    }
    .logo svg { width: 38px; height: 38px; }
    h1 {
      margin: 0 0 10px; font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 900; letter-spacing: -.035em; line-height: 1.05;
      text-wrap: balance;
    }
    h1 span { background: linear-gradient(120deg, var(--turq-deep), var(--turq)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { margin: 0 auto; max-width: 44ch; font-size: 1.08rem; line-height: 1.5; color: var(--muted); text-wrap: balance; }

    .section-title { margin: 0 6px 12px; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

    .tool {
      position: relative; display: flex; flex-direction: column; gap: 10px; padding: 22px; min-height: 200px;
      background: var(--glass); border: 1px solid var(--edge); border-radius: 26px; color: inherit; text-decoration: none;
      box-shadow: var(--shine), var(--shadow);
      -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
      transition: transform .2s, box-shadow .2s;
    }
    a.tool:hover, a.tool:focus-visible { transform: translateY(-3px); box-shadow: var(--shine), 0 18px 48px rgba(16, 196, 196, .3); outline: none; }
    a.tool:focus-visible { box-shadow: 0 0 0 3px var(--turq), var(--shadow); }
    a.tool:active { transform: scale(.98); }
    .tool .icon {
      width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--turq), var(--turq-deep)); color: #050708;
      box-shadow: 0 6px 18px rgba(16, 196, 196, .4), inset 0 1px 0 rgba(255, 255, 255, .55);
    }
    .tool .icon svg { width: 28px; height: 28px; fill: currentColor; }
    .tool h2 { margin: 4px 0 0; font-size: 1.3rem; letter-spacing: -.01em; }
    .tool p { margin: 0; color: var(--muted); line-height: 1.45; flex: 1; }
    .tool .go {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 9px 16px; border-radius: 999px;
      background: #050708; color: #fff; font-weight: 700; font-size: .92rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2);
    }
    @media (prefers-color-scheme: dark) { .tool .go { background: var(--turq); color: #050708; } }
    .tool .go svg { width: 16px; height: 16px; fill: currentColor; }
    .tool.soon { border-style: dashed; box-shadow: var(--shine); }
    .tool.soon .icon { background: var(--turq-soft); color: var(--turq-deep); box-shadow: none; }
    .tool .badge {
      position: absolute; top: 18px; right: 18px; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      padding: 5px 10px; border-radius: 999px; background: var(--turq-soft); color: var(--turq-deep); border: 1px solid var(--edge);
    }
    footer { text-align: center; margin-top: 34px; font-size: .85rem; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { .tool { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 9v12h7v-6h6v6h7V9L12 3zm0 2.3 8 4.8V19h-3v-6H7v6H4v-8.9l8-4.8z"/></svg>
      </div>
      <h1><span>Donsö</span> Källarn</h1>
      <p class="lead">Här finns flera verktyg som kan användas för aktiviteter på källarn.</p>
    </header>

    <div class="section-title">Verktyg</div>
    <div class="grid" id="tools"></div>

    <footer>Donsö Källarn · donsokallarn.se</footer>
  </main>

  <script>
    // Lägg till ett nytt verktyg genom att lägga till en rad här.
    // url: null betyder att verktyget visas som "Kommer snart".
    const TOOLS = [
      {
        name: 'Turneringsskapare',
        text: 'Skapa turneringar med gruppspel, slutspelsträd och poängtabeller. Mata in resultat och följ spelarstatistik.',
        url: 'https://turnering.donsokallarn.se',
        icon: 'M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z',
      },
      { name: 'Kommer snart', text: 'Ett nytt verktyg för aktiviteter på källarn är på väg.', url: null },
      { name: 'Kommer snart', text: 'Fler verktyg läggs till här efter hand.', url: null },
    ];

    const SOON_ICON = 'M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z';
    const ARROW = 'M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z';
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;

    document.getElementById('tools').innerHTML = TOOLS.map((t) =>
      t.url
        ? `<a class="tool" href="${esc(t.url)}"><span class="icon">${svg(t.icon)}</span><h2>${esc(t.name)}</h2><p>${esc(t.text)}</p><span class="go">Öppna ${svg(ARROW)}</span></a>`
        : `<div class="tool soon" aria-disabled="true"><span class="badge">Snart</span><span class="icon">${svg(SOON_ICON)}</span><h2>${esc(t.name)}</h2><p>${esc(t.text)}</p></div>`
    ).join('');
  </script>
  <noscript><p style="text-align:center"><a href="https://turnering.donsokallarn.se">Turneringsskapare</a></p></noscript>
</body>
</html>
